packages:
  - '.'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Upstream packages pin these transitive dependencies; keep their security fixes explicit.
overrides:
  '@nestjs/swagger@11>js-yaml': 5.4.1
  '@prisma/config@6>deepmerge-ts': 8.0.0
  '@nestjs/cli@11>webpack': 5.112.0
