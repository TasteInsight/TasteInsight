location = /werss {
    absolute_redirect off;
    return 308 /werss/$is_args$args;
}

location ^~ /werss/ {
    # WeRSS authenticates its WebSocket with a query token.
    access_log off;
    add_header Content-Security-Policy $werss_content_policy always;
    add_header X-Content-Type-Options nosniff always;
    set $werss_origin ${WERSS_PROXY_ORIGIN};
    rewrite ^/werss/(.*)$ /$1 break;
    proxy_pass $werss_origin;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto ${ADMIN_SCHEME};
    proxy_set_header X-Forwarded-Prefix /werss;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $werss_connection;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_cookie_path / /werss/;
    proxy_redirect ${WERSS_PROXY_ORIGIN}/ /werss/;
    proxy_redirect / /werss/;
}
