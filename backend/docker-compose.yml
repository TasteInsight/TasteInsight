# Unvalued optional entries use --env-file or shell values when present and
# remain absent in the container otherwise, preserving application defaults.
x-database-environment: &database-environment
  NODE_ENV: production
  # Share Compose-resolved raw credentials with the PostgreSQL service.
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_SSLMODE:
  DATABASE_URL:
  RECOMMENDATION_DATABASE_URL:
  # Every production root rejects unsafe legacy startup switches.
  RUN_SEED:
  IMPORT_DATA:
  ENABLE_MOCK_AUTH:

x-runtime-environment: &runtime-environment
  <<: *database-environment
  PORT: 3000
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_REC_DB:
  RECOMMENDATION_MODEL_DEPLOYMENTS:
  EXTERNAL_EMBEDDING_SERVICE_ENABLED:
  EXTERNAL_EMBEDDING_SERVICE_URL: ${EXTERNAL_EMBEDDING_SERVICE_URL:-http://embedding-service:5001}
  EXTERNAL_EMBEDDING_SERVICE_VERSION:
  EMBEDDING_SERVICE_BATCH_SIZE:
  # API producers and the worker agree on whether external delivery is enabled.
  NOTIFICATION_WEBHOOK_URL:
  # Content moderation producers, administration and worker share one provider configuration.
  WECHAT_APPID:
  WECHAT_SECRET:
  MODERATION_ALIYUN_ACCESS_KEY_ID:
  MODERATION_ALIYUN_ACCESS_KEY_SECRET:
  MODERATION_ALIYUN_REGION:
  MODERATION_ALIYUN_TEXT_SERVICE:
  MODERATION_ALIYUN_IMAGE_SERVICE:
  MODERATION_WECHAT_TOKEN:
  MODERATION_WECHAT_AES_KEY:
  MODERATION_MEDIA_SECRET:
  MODERATION_PUBLIC_BASE_URL:
  WERSS_BASE_URL:
  WERSS_ADMIN_URL:
  WERSS_ACCESS_KEY:
  WERSS_SECRET_KEY:

x-upload-storage-environment: &upload-storage-environment
  UPLOAD_DEFAULT_STORAGE_ID:
  UPLOAD_STORAGE_INSTANCES:
  UPLOAD_LOCAL_PATH: /app/uploads
  S3_ENDPOINT:
  S3_REGION:
  S3_BUCKET:
  S3_ACCESS_KEY_ID:
  S3_SECRET_ACCESS_KEY:
  S3_SESSION_TOKEN:
  S3_FORCE_PATH_STYLE:
  S3_PUBLIC_BASE_URL:

x-api-environment: &api-environment
  <<: [*runtime-environment, *upload-storage-environment]
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_EXPIRATION_TIME:
  JWT_REFRESH_EXPIRATION_TIME:
  APP_URL: ${APP_URL:?APP_URL is required}
  ADMIN_APP_URL: ${ADMIN_APP_URL:?ADMIN_APP_URL is required}
  CORS_ALLOWED_ORIGINS:
  TRUSTED_PROXY_CIDRS:
  UPLOAD_BASE_URL:
  UPLOAD_MAX_FILE_SIZE:

x-backend: &backend
  build: .
  image: ${IMAGE_REGISTRY:-ghcr.io/tasteinsight}/tasteinsight-backend:${TAG:-latest}
  volumes:
    - uploads_data:/app/uploads
  networks:
    - tasteinsight_net
    - db_net
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - >-
        fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(3000) })
        .then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1));
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s
  stop_grace_period: 30s
  restart: unless-stopped

services:
  migrate:
    <<: *backend
    environment:
      <<: *database-environment
      INITIAL_ADMIN_USERNAME:
      INITIAL_ADMIN_PASSWORD:
    command: ["node", "dist/src/main.migrate"]
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      recommendation-db:
        condition: service_healthy
        required: false

  public-api:
    <<: *backend
    environment:
      <<: *api-environment
      AUTH_LOGIN_METHODS:
      CAMPUS_VERIFICATION_METHODS:
      WECHAT_APP_APPID:
      WECHAT_APP_SECRET:
      WECHAT_OPEN_PLATFORM_ID:
      AUTH_CHALLENGE_SECRET:
      SMS_GATEWAY_URL:
      SMS_GATEWAY_TOKEN:
      RESEND_API_KEY:
      EMAIL_FROM:
      CAMPUS_EMAIL_DOMAINS:
      CAMPUS_OAUTH_AUTHORIZATION_URL:
      CAMPUS_OAUTH_TOKEN_URL:
      CAMPUS_OAUTH_USERINFO_URL:
      CAMPUS_OAUTH_CLIENT_ID:
      CAMPUS_OAUTH_CLIENT_SECRET:
      CAMPUS_OAUTH_REDIRECT_URI:
      CAMPUS_OAUTH_SCOPE:
      CAMPUS_OAUTH_ISSUER:
      CAMPUS_OAUTH_SUBJECT_CLAIM:
      CAMPUS_OAUTH_STUDENT_CLAIM:
      CAMPUS_OAUTH_STUDENT_VALUES:
      CAMPUS_OAUTH_TOKEN_AUTH_METHOD:
      CAMPUS_VERIFICATION_DAYS:
      AI_PROVIDER:
      AI_API_KEY:
      AI_MODEL:
      AI_BASE_URL:
    command: ["node", "dist/src/main.public"]
    depends_on: &runtime-dependencies
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      werss:
        condition: service_healthy
        required: false
      embedding-service:
        condition: service_healthy
        required: false

  admin-api:
    <<: *backend
    environment: *api-environment
    command: ["node", "dist/src/main.admin"]
    depends_on: *runtime-dependencies

  worker:
    <<: *backend
    environment:
      <<: [*runtime-environment, *upload-storage-environment]
      NOTIFICATION_WEBHOOK_SECRET:
      NOTIFICATION_WEBHOOK_POLL_MS:
      NOTIFICATION_WEBHOOK_TIMEOUT_MS:
      NOTIFICATION_WEBHOOK_MAX_ATTEMPTS:
      NOTIFICATION_WEBHOOK_BACKOFF_MS:
    command: ["node", "dist/src/main.worker"]
    depends_on: *runtime-dependencies
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-90s}

  werss:
    profiles: [werss]
    build:
      context: ./werss
    image: ${WERSS_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/tasteinsight}/tasteinsight-werss:${TAG:-latest}}
    environment:
      TZ: Asia/Shanghai
      DB: sqlite:////app/data/db.db
      PORT: "8001"
      DEBUG: "False"
      ENABLE_JOB: "True"
      USERNAME: ${WERSS_USERNAME:-admin}
      PASSWORD: ${WERSS_PASSWORD:-}
      SECRET_KEY: ${WERSS_SESSION_SECRET:-}
      RSS_BASE_URL: ${WERSS_ADMIN_URL:-${ADMIN_APP_URL}/werss/}
      RSS_FULL_CONTEXT: "True"
      GATHER.MODEL: ${WERSS_GATHER_MODEL:-weread_mp}
      GATHER.CONTENT: "True"
      GATHER.CLEAN_HTML: "False"
      MAX_PAGE: "2"
      SPAN_INTERVAL: "30"
    # Profile services are parsed even when inactive; validate their secrets at startup.
    command:
      - /bin/sh
      - -ec
      - >-
        : "$${PASSWORD:?Set WERSS_PASSWORD before starting WeRSS}";
        : "$${SECRET_KEY:?Set WERSS_SESSION_SECRET before starting WeRSS}";
        exec /app/start.sh
    ports:
      - "127.0.0.1:${WERSS_PORT:-8001}:8001"
    volumes:
      - werss_data:/app/data
    shm_size: 512mb
    networks:
      - tasteinsight_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  embedding-service:
    profiles: [embedding]
    build:
      context: ./python-embedding-service
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/tasteinsight}/tasteinsight-embedding:${TAG:-latest}
    environment:
      # Only pass variables used by the Python service; do not expose backend secrets.
      PYTHON_EMBEDDING_TOKEN: ${PYTHON_EMBEDDING_TOKEN:-}
      PYTHON_EMBEDDING_ENABLED: ${PYTHON_EMBEDDING_ENABLED:-true}
      PYTHON_RANKING_VERSION: ${PYTHON_RANKING_VERSION:-rank-v1}
      PYTHON_RANKING_CHECKPOINT: ${PYTHON_RANKING_CHECKPOINT:-saved_models/rank_v1.pt}
      PYTHON_EMBEDDING_TEXT_MODEL:
      PYTHON_EMBEDDING_DEFAULT_VERSION:
      PYTHON_EMBEDDING_DEVICE:
      # Container startup skips optional v2/v3 preloading unless explicitly enabled.
      PYTHON_EMBEDDING_PRELOAD_MODELS: ${PYTHON_EMBEDDING_PRELOAD_MODELS:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    volumes:
      # Persist trained models
      - embedding_models:/app/saved_models
      # Cache HuggingFace models to avoid re-downloading
      - huggingface_cache:/app/.cache/huggingface
    networks:
      - tasteinsight_net
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/tasteinsight}/tasteinsight-frontend:${TAG:-latest}
    networks:
      - tasteinsight_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  redis:
    extends:
      file: docker-compose.local.yml
      service: redis
    ports: !reset []

  nginx:
    # Open-source upstream DNS re-resolution requires Nginx >= 1.27.3.
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
      ADMIN_APP_URL: ${ADMIN_APP_URL:?ADMIN_APP_URL is required}
      GATEWAY_TLS_MODE: ${GATEWAY_TLS_MODE:-off}
      WERSS_BASE_URL:
      WERSS_ADMIN_URL:
      TLS_CERT_FILE: ${TLS_CERT_FILE:-fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-private.key}
    ports:
      - "${GATEWAY_BIND_HOST:-0.0.0.0}:${HTTP_PORT:-8080}:80"
      - "${GATEWAY_BIND_HOST:-0.0.0.0}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./gateway-render.sh:/docker-entrypoint.d/40-tasteinsight-gateway.sh:ro
      - ./nginx.conf:/etc/tasteinsight/nginx/nginx.conf:ro
      - ./nginx.https.conf.template:/etc/tasteinsight/nginx/nginx.https.conf.template:ro
      - ./nginx.common.conf:/etc/tasteinsight/nginx/nginx.common.conf:ro
      - ./nginx.public.conf:/etc/tasteinsight/nginx/nginx.public.conf:ro
      - ./nginx.admin.conf:/etc/tasteinsight/nginx/nginx.admin.conf:ro
      - ./nginx.werss.conf:/etc/tasteinsight/nginx/nginx.werss.conf:ro
      - ${TLS_CERTS_PATH:-./certs}:/etc/nginx/tls:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      public-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - tasteinsight_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 3 -O /dev/null http://127.0.0.1/health/public &&
          wget -q -T 3 -O /dev/null http://127.0.0.1/health/admin &&
          wget -q -T 3 -O /dev/null http://127.0.0.1/health/frontend
      interval: 10s
      timeout: 12s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  db:
    extends:
      file: docker-compose.local.yml
      service: db
    ports: !reset []

  recommendation-db:
    extends:
      file: docker-compose.local.yml
      service: recommendation-db
    ports: !reset []

volumes:
  werss_data:
  db-data:
  recommendation-db-data:
  uploads_data:
  redis-data:
  embedding_models:
  huggingface_cache:

networks:
  tasteinsight_net:
  db_net:
    internal: true
