services:
  backend:
    build: .
    image: ${IMAGE_REGISTRY:-ghcr.io/tasteinsight}/tasteinsight-backend:${TAG:-latest}
    env_file: .env.production
    environment:
      # Runtime mode and fixed container ports
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXTERNAL_EMBEDDING_SERVICE_URL=http://embedding-service:5001
      - UPLOAD_LOCAL_PATH=/app/uploads
      # Production preflight rejects maintenance switches supplied as true.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Optional profile: wait for the model only when embedding-service is enabled.
      embedding-service:
        condition: service_healthy
        required: false
    # Command is handled by ENTRYPOINT in Dockerfile and docker-entrypoint.sh
    volumes:
      - uploads_data:/app/uploads
    networks:
      - tasteinsight_net
      - db_net
    restart: unless-stopped

  embedding-service:
    profiles: [embedding]
    build:
      context: ./python-embedding-service
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/tasteinsight}/tasteinsight-embedding:${TAG:-latest}
    environment:
      # Only pass variables used by the Python service; do not expose backend secrets.
      - PYTHON_EMBEDDING_PORT=5001
      - PYTHON_EMBEDDING_DEBUG=false
      - PYTHON_EMBEDDING_TEXT_MODEL=${PYTHON_EMBEDDING_TEXT_MODEL:-sentence-transformers/paraphrase-multilingual-mpnet-base-v2}
      - PYTHON_EMBEDDING_DEFAULT_VERSION=${PYTHON_EMBEDDING_DEFAULT_VERSION:-v2}
      - PYTHON_EMBEDDING_MODEL_DIR=/app/saved_models
      - PYTHON_EMBEDDING_DEVICE=${PYTHON_EMBEDDING_DEVICE:-}
      - PYTHON_EMBEDDING_PRELOAD_MODELS=${PYTHON_EMBEDDING_PRELOAD_MODELS:-}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
    volumes:
      # Persist trained models
      - embedding_models:/app/saved_models
      # Cache HuggingFace models to avoid re-downloading
      - huggingface_cache:/app/.cache/huggingface
    networks:
      - tasteinsight_net
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/tasteinsight}/tasteinsight-frontend:${TAG:-latest}
    networks:
      - tasteinsight_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - tasteinsight_net
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  uploads_data:
  redis-data:
  embedding_models:
  huggingface_cache:

networks:
  tasteinsight_net:
    name: tasteinsight_net
  db_net:
    internal: true
