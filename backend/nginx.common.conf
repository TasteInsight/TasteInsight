resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

# Uploaded documents keep an opaque origin when opened as a page.
map $uri $werss_content_policy {
    default "object-src 'none'; base-uri 'self'";
    ~^/files(?:/|$) "default-src 'none'; sandbox";
}

map $http_upgrade $werss_connection {
    default upgrade;
    "" close;
}

upstream public_api {
    zone public_api 64k;
    server public-api:3000 resolve;
}

upstream admin_api {
    zone admin_api 64k;
    server admin-api:3000 resolve;
}

upstream admin_frontend {
    zone admin_frontend 64k;
    server frontend:80 resolve;
}

client_max_body_size 10m;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Docker readiness bypasses TLS without accepting external health requests.
server {
    listen 80;
    server_name localhost 127.0.0.1;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;
    add_header Cache-Control "no-store" always;

    location = /health/public {
        proxy_pass http://public_api/health;
    }

    location = /health/admin {
        proxy_pass http://admin_api/health;
    }

    location = /health/frontend {
        proxy_pass http://admin_frontend/;
    }

    location / {
        return 404;
    }
}
