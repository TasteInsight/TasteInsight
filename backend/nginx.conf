server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location = /api/v1 {
        return 308 /api/v1/;
    }

    # Public API prefix. The trailing slash on proxy_pass intentionally strips
    # /api/v1/ before forwarding because the Nest controllers have no global
    # prefix.
    location /api/v1/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for AI chat server-sent events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # Uploaded images are shared with the backend through uploads_data.
    location /images/ {
        alias /var/www/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        autoindex off;
    }

    # The frontend container owns SPA history fallback and static caching.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
