# Explicit external-dependency mode. Supply external addresses in the selected env file.
# Bundled services can be selected with local-db, local-redis or local-recommendation-db.
x-external-runtime: &external-runtime
  depends_on:
    db:
      required: false
    redis:
      required: false

services:
  db:
    profiles: [local-db]
  redis:
    profiles: [local-redis]
  recommendation-db:
    profiles: !override [local-recommendation-db]
  migrate:
    depends_on:
      db:
        required: false
  public-api:
    <<: *external-runtime
  admin-api:
    <<: *external-runtime
  worker:
    <<: *external-runtime
