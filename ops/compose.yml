name: ${OPS_PROJECT_NAME:-tasteinsight-ops}

x-backup-env: &backup-env
  PGHOST: ${BACKUP_DB_HOST:-db}
  PGPORT: ${BACKUP_DB_PORT:-5432}
  PGDATABASE: ${BACKUP_DB_NAME:?Set BACKUP_DB_NAME}
  PGUSER: ${BACKUP_DB_USER:?Set BACKUP_DB_USER}
  PGPASSWORD: ${BACKUP_DB_PASSWORD:?Set BACKUP_DB_PASSWORD}
  PGCONNECT_TIMEOUT: "10"
  PGSSLMODE: ${BACKUP_DB_SSLMODE:-prefer}
  RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD}
  AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
  BACKUP_HOST: ${BACKUP_HOST:-tasteinsight-production}
  BACKUP_RELEASE: ${BACKUP_RELEASE:-unspecified}
  BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
  BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
  BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
  BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
  BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
  BACKUP_COMMAND_TIMEOUT_SECONDS: ${BACKUP_COMMAND_TIMEOUT_SECONDS:-14400}

services:
  configure:
    build: ./configure
    user: "0:0"
    profiles: [tools]
    environment:
      PROBE_CATALOG_URL:
      PROBE_COMMUNITY_URL:
      PROBE_ADMIN_URL:
      PUBLIC_HEALTH_URL:
      ADMIN_HEALTH_URL:
      WORKER_HEALTH_URL:
      MONITOR_HOST:
      ALERT_CHANNEL:
      ALERT_WEBHOOK_URL:
      ALERT_EMAIL_TO:
      SMTP_FROM:
      SMTP_SMARTHOST:
      SMTP_USERNAME:
      SMTP_PASSWORD:
      BACKUP_MAX_AGE_SECONDS:
    volumes:
      - ./render.py:/render.py:ro
      - ./generated:/generated
    command: [python, /render.py]
    network_mode: none

  prometheus:
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=30d]
    volumes:
      - type: bind
        source: ./generated/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind: {create_host_path: false}
      - ./generated/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring, app]
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes: [./generated/blackbox.yml:/etc/blackbox/blackbox.yml:ro]
    networks: [monitoring, app]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager, --cluster.listen-address=]
    volumes:
      - ./generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3300}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_SECURE_COOKIE:-true}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3300}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    restart: unless-stopped

  # Public HTTP gateway. Never proxy the public hostname directly to Kuma.
  status:
    build: ./status
    environment:
      STATUS_PUBLIC_ENABLED: ${STATUS_PUBLIC_ENABLED:-false}
      STATUS_PAGE_SLUG: ${STATUS_PAGE_SLUG:-public}
    ports: ["127.0.0.1:${STATUS_PORT:-8088}:8080"]
    networks: [status-private, status-edge]
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6
    user: "1000:1000"
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    ports: ["127.0.0.1:${KUMA_ADMIN_PORT:-3301}:3001"]
    volumes: [kuma-data:/app/data]
    networks: [status-private, app]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: ${BACKUP_DB_HOST:-db}:${BACKUP_DB_PORT:-5432}/${BACKUP_DB_NAME}?sslmode=${BACKUP_DB_SSLMODE:-disable}
      DATA_SOURCE_USER: ${METRICS_DB_USER:?Set METRICS_DB_USER}
      DATA_SOURCE_PASS: ${METRICS_DB_PASSWORD:?Set METRICS_DB_PASSWORD}
    networks: [monitoring, database]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    environment:
      REDIS_ADDR: redis://${METRICS_REDIS_HOST:-redis}:${METRICS_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${METRICS_REDIS_PASSWORD:?Set METRICS_REDIS_PASSWORD}
    networks: [monitoring, database]
    restart: unless-stopped

  backup:
    build: ./backup
    stop_grace_period: 45s
    environment: *backup-env
    volumes:
      - uploads:/uploads:ro
      - backup-work:/work
      - backup-metrics:/metrics
    networks: [database, backup-egress]
    restart: unless-stopped

  backup-metrics:
    image: prom/node-exporter:v1.12.1
    command: [--collector.disable-defaults, --collector.textfile, --collector.textfile.directory=/metrics]
    volumes: [backup-metrics:/metrics:ro]
    networks: [monitoring]
    restart: unless-stopped

  host-metrics:
    image: prom/node-exporter:v1.12.1
    profiles: [host]
    command: [--path.rootfs=/host, --path.procfs=/host/proc, --path.sysfs=/host/sys]
    volumes:
      - /:/host:ro,rslave
    pid: host
    networks: [monitoring]
    restart: unless-stopped

volumes:
  kuma-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  backup-work:
  backup-metrics:
  uploads:
    external: true
    name: ${APP_UPLOADS_VOLUME:?Set existing APP_UPLOADS_VOLUME}
networks:
  status-edge:
  status-private:
    internal: true
  monitoring:
  backup-egress:
  app:
    external: true
    name: ${APP_NETWORK:?Set existing APP_NETWORK}
  database:
    external: true
    name: ${APP_DATABASE_NETWORK:?Set existing APP_DATABASE_NETWORK}
