<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TasteInsight 服务状态</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="/" aria-label="TasteInsight 服务状态首页"
          >TasteInsight<span>食鉴</span></a
        ><span class="page-label">服务状态</span>
      </header>
      <section class="overview" aria-labelledby="summary">
        <div class="signal" aria-hidden="true"></div>
        <div>
          <h1 id="summary">正在获取服务状态</h1>
          <p id="updated">请稍候</p>
        </div>
      </section>
      <aside id="notice" hidden>
        <h2>维护公告</h2>
        <p id="notice-text"></p>
      </aside>
      <section aria-labelledby="services-heading">
        <div class="section-title">
          <h2 id="services-heading">当前服务</h2>
          <button id="refresh" type="button">刷新状态</button>
        </div>
        <ul id="services" aria-live="polite" aria-busy="true"></ul>
      </section>
      <footer>
        <p>每 30 秒自动更新</p>
        <p id="feedback" role="status"></p>
      </footer>
      <noscript><p>请启用 JavaScript 查看最新服务状态。</p></noscript>
    </main>
  </body>
</html>
