name: CI - Frontend

on:
  workflow_call:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.21.0'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            frontend-web/pnpm-lock.yaml
            frontend-miniapp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm type-check

      - name: Run ESLint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:unit

      - name: Install miniapp dependencies
        working-directory: ./frontend-miniapp
        run: pnpm install --frozen-lockfile

      - name: Check miniapp TypeScript
        working-directory: ./frontend-miniapp
        run: pnpm type-check

      - name: Run miniapp ESLint
        working-directory: ./frontend-miniapp
        run: pnpm lint

      - name: Run miniapp unit tests
        working-directory: ./frontend-miniapp
        run: pnpm test --runInBand --watchman=false

      - name: Build miniapp targets
        working-directory: ./frontend-miniapp
        env:
          VITE_API_BASE_URL: https://api.example.test
          VITE_ENABLE_TEST_LOGIN: 'false'
        run: |
          pnpm build:mp-weixin
          pnpm build:h5
          pnpm build:app
