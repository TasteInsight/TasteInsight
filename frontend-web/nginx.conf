server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html contains the current asset hashes and must be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Vite filenames under /assets are content-hashed.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history fallback. API proxying belongs to backend/nginx.conf.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
